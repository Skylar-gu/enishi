<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9c2"/>
      <stop offset=".5" stop-color="#cbb8ff"/>
      <stop offset="1" stop-color="#9fd4ff"/>
    </linearGradient>
  </defs>

  <!-- translucent wings, black outline so the shape reads on any tab colour -->
  <g fill="url(#wing)" fill-opacity=".55" stroke="#111111" stroke-opacity=".9"
     stroke-width="1.1" stroke-linejoin="round">
    <path d="M16 15 C 12 5, 3 4, 3 11 C 3 16.5, 9 18, 16 16 Z"/>
    <path d="M16 15 C 20 5, 29 4, 29 11 C 29 16.5, 23 18, 16 16 Z"/>
    <path d="M16 16 C 12 20, 6 22, 7 27 C 8 30, 14 28, 16 21 Z"/>
    <path d="M16 16 C 20 20, 26 22, 25 27 C 24 30, 18 28, 16 21 Z"/>
  </g>

  <!-- body + antennae -->
  <g stroke="#111111" stroke-opacity=".9" stroke-linecap="round" fill="none">
    <line x1="16" y1="9.5" x2="16" y2="22.5" stroke-width="1.8"/>
    <path d="M16 10 C 15 7, 13 6, 12 5.5" stroke-width="1"/>
    <path d="M16 10 C 17 7, 19 6, 20 5.5" stroke-width="1"/>
  </g>
</svg>
