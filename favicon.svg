<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9c2"/>
      <stop offset=".5" stop-color="#cbb8ff"/>
      <stop offset="1" stop-color="#9fd4ff"/>
    </linearGradient>
  </defs>

  <!-- wings: translucent gradient, glassy white edge, transparent ground -->
  <g fill="url(#wing)" fill-opacity=".6" stroke="#ffffff" stroke-opacity=".3" stroke-width=".6">
    <path d="M16 15 C 12 5, 3 4, 3 11 C 3 16.5, 9 18, 16 16 Z"/>
    <path d="M16 15 C 20 5, 29 4, 29 11 C 29 16.5, 23 18, 16 16 Z"/>
    <path d="M16 16 C 12 20, 6 22, 7 27 C 8 30, 14 28, 16 21 Z"/>
    <path d="M16 16 C 20 20, 26 22, 25 27 C 24 30, 18 28, 16 21 Z"/>
  </g>

  <!-- body + antennae -->
  <g stroke="#f0e6da" stroke-opacity=".8" stroke-linecap="round" fill="none">
    <line x1="16" y1="10" x2="16" y2="22" stroke-width="1.4"/>
    <path d="M16 10 C 15 7, 13 6, 12 6" stroke-width=".8"/>
    <path d="M16 10 C 17 7, 19 6, 20 6" stroke-width=".8"/>
  </g>
</svg>
