<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in Orbit</title>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #2a1638; --pink: #ff8fc7; --gold: #ffe27a; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box;
      background: radial-gradient(#fff 1px, transparent 1.5px) 0 0/36px 36px, radial-gradient(ellipse at 50% 0%, #3d2270, #1b1033); color: #fff6fb; font-family: "DotGothic16", sans-serif; }
    h1 { font-family: "Press Start 2P", monospace; font-weight: 400; color: var(--pink); font-size: clamp(28px, 8vw, 64px); text-shadow: 4px 4px 0 var(--ink); margin: 0 0 12px; }
    .phone { font-size: 64px; display: inline-block; animation: spin 6s linear infinite; }
    a { display: inline-block; margin-top: 20px; font-family: "Press Start 2P", monospace; font-size: 11px; color: #fff; background: #ff4fa3; border: 3px solid var(--ink); border-radius: 10px; padding: 12px 16px; text-decoration: none; box-shadow: 0 4px 0 var(--ink); }
    p { color: #ffcfe6; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .phone { animation: none; } }
  </style>
</head>
<body>
  <div>
    <div class="phone">📱</div>
    <h1>404</h1>
    <p>圏外 — no signal. this page drifted out of orbit.</p>
    <a href="./">▶ RETURN TO THE MECHANISM</a>
  </div>
</body>
</html>
